<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Stardew Valley</title>
  <base href="/" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #theCanvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; touch-action: none; }
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #cfc6a8; background: #1b1a17;
      font: 14px ui-monospace, Menlo, monospace; text-align: center;
    }
    #boot[role="alert"] { white-space: pre-line; padding: 24px; }
    .boot-panel { width: min(28rem, calc(100vw - 3rem)); }
    .boot-status { margin: 0 0 12px; }
    .boot-bar {
      height: 16px;
      box-sizing: border-box;
      padding: 2px;
      border: 2px solid #cfc6a8;
      background: #0e0d0b;
    }
    .boot-bar-fill {
      height: 100%;
      width: 0%;
      background: #e6c35c;
      box-shadow: inset 0 1px 0 #f4e19a;
    }
    @media (prefers-reduced-motion: no-preference) {
      .boot-bar-fill { transition: width 100ms linear; }
    }
    .boot-detail {
      margin: 12px 0 0;
      color: #8a8370;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="theCanvas" width="1280" height="720"></canvas>
  <div id="boot">
    <div class="boot-panel">
      <p class="boot-status" id="boot-status">loading the .NET runtime</p>
      <div class="boot-bar" id="boot-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="boot-status">
        <div class="boot-bar-fill" id="boot-fill"></div>
      </div>
      <p class="boot-detail" id="boot-detail">this takes a while on a cold cache</p>
    </div>
  </div>

  <script>
    // Surface managed exceptions on the page instead of only in the console;
    // a WASM failure otherwise looks like a blank canvas.
    window.__errs = [];
    window.reportBootError = function (message) {
      window.__bootFailed = true;
      window.__errs.push(message);
      var boot = document.getElementById('boot');
      if (!boot) {
        boot = document.createElement('div');
        boot.id = 'boot';
        document.body.appendChild(boot);
      }
      boot.setAttribute('role', 'alert');
      boot.textContent = message.slice(0, 2000);
    };
    window.addEventListener('error', function (e) {
      reportBootError(String((e.error && e.error.stack) || e.message));
    });
    window.addEventListener('unhandledrejection', function (e) {
      reportBootError('unhandled rejection: ' + String((e.reason && e.reason.stack) || e.reason));
    });
    // Blazor reports managed exceptions through console.error rather than the
    // error event, and the managed stack only lives on the argument object.
    var nativeConsoleError = console.error.bind(console);
    console.error = function () {
      for (var i = 0; i < arguments.length; i++) {
        var a = arguments[i];
        if (a && (a.stack || a.message)) {
          reportBootError(String(a.message || '') + '\n\n' + String(a.stack || ''));
        } else if (typeof a === 'string' && a.indexOf('   at ') >= 0) {
          // Console.Error.WriteLine of a managed exception arrives as a plain string.
          reportBootError(a);
        }
      }
      return nativeConsoleError.apply(null, arguments);
    };
  </script>

  <script>
    // Combined bar: runtime downloads occupy the first half, game asset XHRs the second.
    (function () {
      var runtimeLoaded = 0;
      var runtimeTotal = 0;
      var assetsLoaded = 0;
      var assetsTotal = 1262;
      var runtimeDone = false;

      function isGameAsset(url) {
        var value = String(url);
        return /(?:^|\/)Content\//.test(value) || /ContentHashes\.json/i.test(value);
      }

      function percent() {
        var runtimeFrac = runtimeTotal > 0 ? runtimeLoaded / runtimeTotal : (runtimeDone ? 1 : 0);
        if (!runtimeDone && runtimeFrac > 0.95) runtimeFrac = 0.95;
        var assetFrac = assetsTotal > 0 ? Math.min(assetsLoaded, assetsTotal) / assetsTotal : 0;
        return Math.round((Math.min(runtimeFrac, 1) * 0.5 + (runtimeDone ? Math.min(assetFrac, 1) : 0) * 0.5) * 100);
      }

      function render() {
        if (window.__bootFailed) return;
        var fill = document.getElementById('boot-fill');
        var status = document.getElementById('boot-status');
        var detail = document.getElementById('boot-detail');
        var bar = document.getElementById('boot-bar');
        var pct = percent();
        if (fill && fill.style) fill.style.width = pct + '%';
        if (bar && bar.setAttribute) bar.setAttribute('aria-valuenow', String(pct));
        if (status) {
          status.textContent = runtimeDone
            ? (assetsLoaded > 0 ? 'loading game assets' : 'starting the game')
            : 'loading the .NET runtime';
        }
        if (detail) {
          if (runtimeDone && assetsLoaded > 0) {
            detail.textContent = assetsLoaded + ' / ' + assetsTotal + ' files';
          } else if (!runtimeDone && runtimeTotal > 0) {
            detail.textContent = runtimeLoaded + ' / ' + runtimeTotal + ' files';
          } else {
            detail.textContent = 'this takes a while on a cold cache';
          }
        }
      }

      window.__boot = {
        percent: percent,
        getState: function () {
          return {
            runtimeLoaded: runtimeLoaded,
            runtimeTotal: runtimeTotal,
            assetsLoaded: assetsLoaded,
            assetsTotal: assetsTotal,
            runtimeDone: runtimeDone,
            percent: percent(),
          };
        },
        setRuntime: function (loaded, total) {
          runtimeLoaded = loaded;
          if (typeof total === 'number') runtimeTotal = total;
          render();
        },
        expectRuntime: function () {
          runtimeTotal += 1;
          render();
        },
        addRuntime: function () {
          runtimeLoaded += 1;
          if (runtimeTotal > 0 && runtimeLoaded > runtimeTotal) runtimeLoaded = runtimeTotal;
          render();
        },
        finishRuntime: function () {
          runtimeDone = true;
          if (runtimeTotal < runtimeLoaded) runtimeTotal = runtimeLoaded;
          if (runtimeTotal > 0) runtimeLoaded = runtimeTotal;
          render();
        },
        setAssets: function (loaded, total) {
          assetsLoaded = loaded;
          if (typeof total === 'number') assetsTotal = total;
          render();
        },
        addAsset: function () {
          assetsLoaded += 1;
          if (assetsLoaded > assetsTotal) assetsTotal = assetsLoaded;
          render();
        },
        render: render,
      };

      window.reportBootStage = function (name) {
        window.__stages = window.__stages || [];
        window.__stages.push(name);
        window.__boot.finishRuntime();
        render();
      };

      window.clearBoot = function () {
        window.__boot.finishRuntime();
        assetsLoaded = Math.max(assetsLoaded, assetsTotal);
        render();
        var boot = document.getElementById('boot');
        if (boot && boot.remove) boot.remove();
      };

      if (typeof XMLHttpRequest !== 'undefined') {
        var nativeOpen = XMLHttpRequest.prototype.open;
        var nativeSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function (method, url) {
          this._bootUrl = url;
          return nativeOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function () {
          var result = nativeSend.apply(this, arguments);
          if (!window.__bootFailed && isGameAsset(this._bootUrl || '')) {
            window.__boot.addAsset();
          }
          return result;
        };
      }

      function countBootResources(manifest) {
        var resources = (manifest && manifest.resources) || {};
        var n = 0;
        function walk(value) {
          if (!value || typeof value !== 'object' || Array.isArray(value)) return;
          var keys = Object.keys(value);
          if (keys.length && keys.every(function (key) { return typeof value[key] === 'string'; })) {
            n += keys.length;
            return;
          }
          keys.forEach(function (key) { walk(value[key]); });
        }
        walk(resources);
        return n;
      }

      window.startBlazor = function () {
        if (typeof Blazor === 'undefined') return;
        function begin(expected) {
          if (expected > 0) window.__boot.setRuntime(0, expected);
          var started = Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
              if (type === 'dotnetjs') return defaultUri;
              var init = {};
              if (integrity) init.integrity = integrity;
              var request = fetch(defaultUri, init);
              if (expected <= 0) window.__boot.expectRuntime();
              request.then(function () { window.__boot.addRuntime(); }, function () { window.__boot.addRuntime(); });
              return request;
            }
          });
          Promise.resolve(started).then(function () {
            window.__boot.finishRuntime();
          }, function (err) {
            window.reportBootError(String((err && err.stack) || err));
          });
        }
        fetch('_framework/blazor.boot.json').then(function (response) {
          return response.json();
        }).then(function (manifest) {
          begin(countBootResources(manifest));
        }).catch(function () {
          begin(0);
        });
      };
    })();
  </script>

  <script>
    // ?debug=1 preserves the framebuffer for readback. Keep the tab visible:
    // preserving pixels does not make a hidden page run at normal frame rates.
    // Off by default because preserveDrawingBuffer costs real performance.
    if (new URLSearchParams(location.search).has('debug')) {
      var originalGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === 'webgl2' || type === 'webgl') {
          attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true });
        }
        return originalGetContext.call(this, type, attrs);
      };
    }
  </script>

  <!-- nkast.Wasm JS interop, required before the runtime starts -->
  <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Canvas/js/Canvas2dContext.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
  <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

  <script>
    // The game asks to be driven from here: KNI's Blazor platform does not start
    // its own loop, and pacing it from managed code starves on Blazor's
    // synchronization context.
    window.__frames = 0;
    window.startGameLoop = function (dotnetRef) {
      // KNI reads pointer coordinates in CSS pixels. Its resize handler updates
      // the canvas and graphics device together, but startup otherwise leaves
      // a 1280x720 buffer stretched to the window, with misaligned hit targets.
      window.dispatchEvent(new Event('resize'));
      function frame() {
        try {
          if (!dotnetRef.invokeMethod('Tick')) { return; }
          window.__frames++;
        } catch (e) {
          console.error(e);
          return;
        }
        schedule(frame);
      }
      // requestAnimationFrame does not fire while the page is hidden, which stops
      // the game entirely rather than pausing it. Fall back to a timer so a
      // background tab keeps running (slowly, as the browser clamps it).
      function schedule(fn) {
        if (document.hidden) { setTimeout(fn, 16); } else { requestAnimationFrame(fn); }
      }
      schedule(frame);
    };
  </script>

  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script>
    if (typeof Blazor !== 'undefined') startBlazor();
  </script>
</body>
</html>
