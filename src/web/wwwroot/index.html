<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Stardew Valley</title>
  <base href="/" />
  <script defer src="js/alpine.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #theCanvas {
      position: relative;
      z-index: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      touch-action: none;
    }

    #theCanvas.pointer-locked {
      cursor: none;
    }

    #title {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      color: #cfc6a8;
      background: #1b1a17;
      font: 14px ui-monospace, Menlo, monospace;
      text-align: center;
    }

    .title-panel {
      width: min(28rem, calc(100vw - 3rem));
    }

    .title-name {
      margin: 0 0 20px;
      font: inherit;
      font-size: 20px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e6c35c;
    }

    .title-play {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 2px solid #cfc6a8;
      background: #0e0d0b;
      color: #cfc6a8;
      font: inherit;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .title-play:hover,
    .title-play:focus-visible {
      background: #e6c35c;
      color: #1b1a17;
      outline: none;
    }

    .title-detail {
      margin: 12px 0 0;
      color: #8a8370;
      font-size: 12px;
    }

    .title-detail code {
      color: #cfc6a8;
      font: inherit;
    }

    /* The input sits inside its label so it keeps focus and keyboard activation. */
    .title-file {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .title-play:focus-within {
      background: #e6c35c;
      color: #1b1a17;
    }

    .title-play.is-busy {
      cursor: progress;
    }

    .title-error {
      margin: 12px 0 0;
      color: #d98b6a;
      font-size: 12px;
    }

    .title-forget {
      margin: 16px 0 0;
      padding: 0;
      border: 0;
      background: none;
      color: #8a8370;
      font: inherit;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }

    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #cfc6a8;
      background: #1b1a17;
      font: 14px ui-monospace, Menlo, monospace;
      text-align: center;
    }

    #boot[role="alert"] {
      white-space: pre-line;
      padding: 24px;
    }

    .boot-panel {
      width: min(28rem, calc(100vw - 3rem));
    }

    .boot-status {
      margin: 0 0 12px;
    }

    #boot-jigsaw {
      display: block;
      width: min(280px, 70vw);
      height: auto;
      aspect-ratio: 1;
      margin: 0 auto 16px;
      touch-action: none;
      cursor: grab;
      image-rendering: pixelated;
      background: #0e0d0b;
    }

    #boot-jigsaw:active {
      cursor: grabbing;
    }

    .boot-bar {
      height: 16px;
      box-sizing: border-box;
      padding: 2px;
      border: 2px solid #cfc6a8;
      background: #0e0d0b;
    }

    .boot-bar-fill {
      height: 100%;
      width: 0%;
      background: #e6c35c;
      box-shadow: inset 0 1px 0 #f4e19a;
    }

    @media (prefers-reduced-motion: no-preference) {
      .boot-bar-fill {
        transition: width 100ms linear;
      }
    }

    .boot-detail {
      margin: 12px 0 0;
      color: #8a8370;
      font-size: 12px;
    }

    .boot-error {
      margin: 0;
      max-width: min(40rem, calc(100vw - 3rem));
      white-space: pre-line;
      text-align: left;
      font: inherit;
    }

    #profiler {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 2147483647;
      margin: 0;
      padding: 8px 10px;
      max-width: min(28rem, calc(100vw - 16px));
      max-height: calc(100vh - 16px);
      overflow: auto;
      pointer-events: none;
      color: #e8e0c8;
      background: rgba(14, 13, 11, 0.82);
      font: 11px/1.4 ui-monospace, Menlo, monospace;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    #profiler .profiler-charts {
      display: grid;
      gap: 6px;
    }

    #profiler .profiler-chart-wrap {
      display: grid;
      gap: 2px;
    }

    #profiler .profiler-chart-label {
      color: #8a8370;
      font-size: 10px;
    }

    #profiler .profiler-ind {
      margin-right: 8px;
    }

    #profiler .profiler-ind::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 4px;
      vertical-align: middle;
      background: currentColor;
    }

    #profiler .profiler-ind[data-key="wasm"] { color: #e6c35c; }
    #profiler .profiler-ind[data-key="js"] { color: #8ec8c8; }
    #profiler .profiler-ind[data-key="gc"] { color: #c9a0dc; }

    #profiler .profiler-chart {
      display: block;
      width: 240px;
      height: 48px;
      background: #0e0d0b;
    }
  </style>
</head>

<body>
  <canvas id="theCanvas" width="1280" height="720"></canvas>
  <div id="title" x-data x-show="$store.title.visible">
    <div class="title-panel">
      <h1 class="title-name">Stardew Valley</h1>
      <template x-if="!$store.ownership.ready">
        <p class="title-detail">checking with the host</p>
      </template>
      <template x-if="$store.ownership.ready && !$store.ownership.unlocked">
        <div>
          <label class="title-play" :class="$store.ownership.checking ? 'is-busy' : null">
            <span x-text="$store.ownership.checking ? 'checking your copy' : 'Choose Stardew Valley.dll'">Choose Stardew Valley.dll</span>
            <input class="title-file" type="file" :disabled="$store.ownership.checking"
              @change="$store.ownership.submit($event)" />
          </label>
          <p class="title-detail">this build plays only from your own copy of the game &mdash; point it at
            <code>Stardew Valley.dll</code> in the folder Steam or GOG installed. The host checks a few
            kilobytes of it against its own copy; the file itself is never uploaded.</p>
          <p class="title-error" role="alert" x-show="$store.ownership.error" x-text="$store.ownership.error"></p>
        </div>
      </template>
      <template x-if="$store.ownership.ready && $store.ownership.unlocked">
        <div>
          <button class="title-play" type="button" @click="$store.title.play()">Play</button>
          <p class="title-detail"><span x-text="$store.ownership.detail"></span> &mdash; runs in this tab;
            saves stay in this browser</p>
          <button class="title-forget" type="button" @click="$store.ownership.forget()">forget my copy</button>
        </div>
      </template>
    </div>
  </div>
  <div id="boot" x-data x-show="$store.boot.visible" :role="$store.boot.failed ? 'alert' : null">
    <div class="boot-panel" x-show="!$store.boot.failed">
      <p class="boot-status" id="boot-status" x-text="$store.boot.status">loading the .NET runtime</p>
      <canvas id="boot-jigsaw" width="270" height="270"></canvas>
      <div class="boot-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
        :aria-valuenow="$store.boot.percent" aria-labelledby="boot-status">
        <div class="boot-bar-fill" :style="{ width: $store.boot.percent + '%' }"></div>
      </div>
      <p class="boot-detail" x-text="$store.boot.detail">this takes a while on a cold cache</p>
    </div>
    <pre class="boot-error" x-show="$store.boot.failed" x-text="$store.boot.error"></pre>
  </div>
  <div id="profiler" hidden>
    <div class="profiler-charts">
      <div class="profiler-chart-wrap">
        <span class="profiler-chart-label" data-label="fps">fps</span>
        <canvas class="profiler-chart" data-series="fps" width="240" height="48"></canvas>
      </div>
      <div class="profiler-chart-wrap">
        <span class="profiler-chart-label" data-label="ms">frame ms</span>
        <canvas class="profiler-chart" data-series="ms" width="240" height="48"></canvas>
      </div>
      <div class="profiler-chart-wrap">
        <span class="profiler-chart-label" data-label="mem">
          <span class="profiler-ind" data-key="wasm">wasm</span>
          <span class="profiler-ind" data-key="js">js</span>
          <span class="profiler-ind" data-key="gc">gc</span>
        </span>
        <canvas class="profiler-chart" data-series="mem" width="240" height="48"></canvas>
      </div>
    </div>
  </div>

  <script src="js/audio-output.js"></script>
  <script src="js/ownership.js"></script>
  <script src="js/host.js"></script>
  <script src="js/boot-jigsaw.js"></script>
</body>

</html>
